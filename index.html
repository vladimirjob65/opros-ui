<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Домашний Claude — мост</title>
<style>
  body{font-family:Segoe UI,sans-serif;max-width:800px;margin:40px auto;padding:0 16px;background:#0d1117;color:#e6edf3}
  textarea{width:100%;height:110px;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px}
  button{background:#238636;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:8px}
  button:disabled{background:#21262d;color:#8b949e}
  pre{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;white-space:pre-wrap;min-height:120px}
  .row{display:flex;gap:8px}
  input{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px;flex:1}
  #status{color:#8b949e;margin:8px 0}
</style>
</head>
<body>
<h2>🏠 Домашний Claude (мост через GitHub)</h2>
<div class="row">
  <input id="token" type="password" placeholder="Вставьте Personal Access Token (ghp_...)">
  <button onclick="saveToken()">Сохранить токен</button>
</div>
<div id="status">Токен не сохранён</div>
<textarea id="prompt" placeholder="Введите вопрос / задачу для Claude…"></textarea>
<button id="send" onclick="sendPrompt()">Отправить домой</button>
<h3>Ответ:</h3>
<pre id="out">—</pre>
<script>
const OWNER="vladimirjob65", REPO="opros-bridge", API="https://api.github.com";
const token=()=>localStorage.getItem("gh_token")||"";
function saveToken(){localStorage.setItem("gh_token",document.getElementById("token").value.trim());
  document.getElementById("status").textContent="✅ Токен сохранён (только в вашем браузере)";}
if(token())document.getElementById("status").textContent="✅ Токен уже сохранён";
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function api(m,p,b){
  const r=await fetch(`${API}/repos/${OWNER}/${REPO}/${p}`,{method:m,
    headers:{Authorization:`Bearer ${token()}`,Accept:"application/vnd.github+json"},
    body:b?JSON.stringify(b):undefined});
  if(r.status===404)return null;
  if(!r.ok)throw new Error(`GitHub ${r.status}: ${(await r.text()).slice(0,200)}`);
  return r.json();
}
async function sendPrompt(){
  const text=document.getElementById("prompt").value.trim();
  if(!text)return alert("Введите вопрос");
  if(!token())return alert("Сначала сохраните токен");
  const out=document.getElementById("out"),btn=document.getElementById("send");
  btn.disabled=true;out.textContent="⏳ Отправляю задачу…";
  try{
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    await api("PUT",`contents/tasks/${id}.json`,{message:`task ${id}`,content:b64e(JSON.stringify({prompt:text}))});
    out.textContent="⏳ Задача ушла домой. Жду ответ (домашний ПК должен быть включён)…";
    while(true){
      await new Promise(r=>setTimeout(r,5000));
      const res=await api("GET",`contents/results/${id}.txt`);
      if(res){out.textContent=b64d(res.content);break;}
    }
  }catch(e){out.textContent="❌ "+e.message;}
  btn.disabled=false;
}
</script>
</body>
</html>
